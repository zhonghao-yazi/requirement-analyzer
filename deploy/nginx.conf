# Nginx 反向代理配置
#
# 使用方式：
#   1. 构建前端：cd requirement-analyzer && npm run build
#   2. 启动后端：cd backend && python -m uvicorn main:app --host 127.0.0.1 --port 8000
#   3. 将 dist/ 拷贝到 nginx 静态文件目录
#   4. 启动 nginx：nginx -c /path/to/this/file
#
# 生产环境建议使用绝对路径和 HTTPS 配置。

worker_processes auto;
error_log /var/log/nginx/requirement-analyzer-error.log;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    server {
        listen 80;
        server_name localhost;

        # 前端静态文件
        root /var/www/requirement-analyzer/dist;
        index index.html;

        # SPA 路由回退（Vite/React Router）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API 反向代理到后端
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时配置（AI 分析可能较长）
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;

            # 文件上传大小限制
            client_max_body_size 20m;
        }

        # 静态资源缓存
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
